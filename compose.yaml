services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: feedback
      POSTGRES_PASSWORD: feedback
      POSTGRES_DB: feedback
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feedback"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - feedback-data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
  api:
    build: .
    environment:
      DATABASE_URL: postgres://feedback:feedback@postgres:5432/feedback?sslmode=disable
      OIDC_USERINFO_URL: ${OIDC_USERINFO_URL:-https://auth.integ.life/userinfo}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
    ports: ["8080:8080"]
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  feedback-data:
